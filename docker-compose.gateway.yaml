services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: ftybucks-gateway
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls: [net.ipv4.ip_forward=1]
    ports: ["51820:51820/udp"]
    volumes:
      - ./configs/gateway.yaml:/etc/gateway/gateway.yaml:ro
      - gateway-geoip:/var/lib/geoip
      - gateway-data:/etc/gateway

volumes:
  gateway-geoip:
  gateway-data:
